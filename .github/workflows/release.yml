name: Release APK

# Tạo release: git tag v2.1.0 && git push origin v2.1.0
# (tag phải khớp versionName trong app/build.gradle.kts)
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches versionName
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          echo "tag=$TAG versionName=$NAME"
          if [ "$TAG" != "$NAME" ]; then
            echo "::error::Tag v$TAG does not match versionName $NAME in app/build.gradle.kts"
            exit 1
          fi

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: "zulu"
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Decode keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "::error::Missing secret RELEASE_KEYSTORE_BASE64"
            exit 1
          fi
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Build signed release APK
        env:
          RELEASE_KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          SPOTIFY_CLIENT_ID: ${{ vars.SPOTIFY_CLIENT_ID }}
          AI_TRANSLATE_KEY: ${{ secrets.AI_TRANSLATE_KEY }}
          AI_TRANSLATE_PROVIDER: ${{ vars.AI_TRANSLATE_PROVIDER }}
          AI_TRANSLATE_MODEL: ${{ vars.AI_TRANSLATE_MODEL }}
          AI_TRANSLATE_FALLBACKS: ${{ secrets.AI_TRANSLATE_FALLBACKS }}
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Prepare APK
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          if [[ "$APK" == *unsigned* ]]; then
            echo "::error::APK is unsigned, check the signing secrets"
            exit 1
          fi
          cp "$APK" "Mewze-${GITHUB_REF_NAME}.apk"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "Mewze-${GITHUB_REF_NAME}.apk" \
            --title "Mewze ${GITHUB_REF_NAME}" \
            --generate-notes
