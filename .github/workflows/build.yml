name: Build debug APK
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - '**'
    paths-ignore:
      - 'README.md'
      - 'assets/**'

permissions:
  contents: read

# A newer push to the same branch cancels the older run.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: "zulu"
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x gradlew

      # Unit tests first: sync logic (JVM), Room migrations (Robolectric) and snapshot compatibility.
      # Network-dependent tests are @Ignore'd, so this is deterministic.
      - name: Unit tests
        run: ./gradlew testDebugUnitTest :innertube:test :kugou:test :lrclib:test --stacktrace

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/

      - name: Build debug APK
        env:
          SPOTIFY_CLIENT_ID: ${{ vars.SPOTIFY_CLIENT_ID }}
          AI_TRANSLATE_KEY: ${{ secrets.AI_TRANSLATE_KEY }}
          AI_TRANSLATE_PROVIDER: ${{ vars.AI_TRANSLATE_PROVIDER }}
          AI_TRANSLATE_MODEL: ${{ vars.AI_TRANSLATE_MODEL }}
          AI_TRANSLATE_FALLBACKS: ${{ secrets.AI_TRANSLATE_FALLBACKS }}
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app
          path: app/build/outputs/apk/debug/*.apk